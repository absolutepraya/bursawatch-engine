      required: [api_version, publication_id, owner_id, owner_key, version, supersedes_version, type, route, source_event_key, source_name, source_url, source_published_at, market_data_as_of, delivery_confirmed_at, title, ticker, broker_levels, parent_publication_id, board_episode_id, config_revision, renderer_version, source_version, required_operation_keys, legs, digest]
      properties:
        api_version: {type: integer, const: 1}
        publication_id: {type: string, pattern: '^[0-9a-f]{64}$'}
        owner_id: {type: string}
        owner_key: {type: string}
        version: {type: integer}
        supersedes_version: {type: [integer, 'null']}
        type: {type: string, enum: [idx_company_news, us_company_news, industry_news, macro_news, stock_status, broker_swing_plan, broker_swing_update, swing_context, swing_bundle, swing_board_update]}
        route: {type: string, enum: [id_stocks_news, id_industry_news, macro_news, us_stocks_news, id_stocks_swing, swing_board]}
        source_event_key: {type: [string, 'null']}
        source_name: {type: string}
        source_url: {type: [string, 'null'], format: uri}
        source_published_at: {type: [string, 'null'], format: date-time}
        market_data_as_of: {type: [string, 'null'], format: date-time}
        delivery_confirmed_at: {type: string, format: date-time}
        title: {type: string}
        ticker: {type: [string, 'null']}
        broker_levels: {type: [object, 'null']}
        parent_publication_id: {type: [string, 'null']}
        board_episode_id: {type: [string, 'null']}
        config_revision: {type: [integer, 'null']}
        renderer_version: {type: string}
        source_version: {type: [string, 'null']}
        required_operation_keys: {type: array, maxItems: 64, items: {type: string}}
        legs: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/PublicationLeg'}}
        digest: {type: string, pattern: '^[0-9a-f]{64}$'}
    PublicationAck:
