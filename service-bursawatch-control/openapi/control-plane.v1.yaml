      required: [compared_at, confirmed_through_at, accepted_through_at, outstanding_count]
      properties:
        compared_at: {type: string, format: date-time}
        confirmed_through_at: {type: [string, 'null'], format: date-time}
        accepted_through_at: {type: [string, 'null'], format: date-time}
        outstanding_count: {type: integer, minimum: 0, maximum: 1000000}
    PublicationCoverage:
      type: object
