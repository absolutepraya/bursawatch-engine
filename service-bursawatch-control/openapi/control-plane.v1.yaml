        name: {type: string, minLength: 1, maxLength: 120}
        kind: {type: string, enum: [person, group, community]}
        asset_ref:
          oneOf:
            - {$ref: '#/components/schemas/AssetReference'}
            - {type: 'null'}
    SourceEndpointInput:
      type: object
      additionalProperties: false
      required: [id, publisher_id, platform, address, credential_ref]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,63}$'}
        publisher_id: {type: string}
        platform: {type: string, enum: [telegram, x, instagram, whatsapp]}
        address: {type: string, pattern: '^[A-Za-z0-9_.]{1,64}$'}
        credential_ref:
          oneOf:
            - {type: string, pattern: '^credential:[a-z0-9][a-z0-9-]{1,63}$'}
            - {type: 'null'}
    PublisherDefaultInput:
      type: object
      additionalProperties: false
      required: [publisher_id, capability_id, enabled, settings]
      properties:
        publisher_id: {type: string}
        capability_id: {type: string}
        enabled: {type: boolean}
        settings: {type: object, maxProperties: 0}
    EndpointOverrideInput:
      type: object
      additionalProperties: false
      required: [endpoint_id, capability_id, enabled, settings]
      properties:
        endpoint_id: {type: string}
        capability_id: {type: string}
        enabled: {type: boolean}
        settings: {type: object, maxProperties: 0}
    SourceCatalogRevision:
      type: object
      required: [revision, config, sha256, actor_id, updated_at]
      properties:
        revision: {type: integer}
        config: {$ref: '#/components/schemas/SourceCatalogConfig'}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        actor_id: {type: string}
        updated_at: {type: string, format: date-time}
    SourceCatalog:
      type: object
      required: [securities, institutions, people_org, endpoints, capabilities, compatibility, config, can_edit]
      properties:
        securities: {type: array, items: {type: object}}
        institutions: {type: array, items: {type: object}}
        people_org: {type: array, items: {type: object}}
        endpoints: {type: array, items: {type: object}}
        capabilities: {type: array, items: {type: object}}
        compatibility:
          type: array
          items: {$ref: '#/components/schemas/SourceCompatibility'}
        config: {$ref: '#/components/schemas/SourceCatalogRevision'}
        can_edit: {type: boolean, description: True only for an authenticated admin user.}
    SourceCompatibility:
      type: object
      required: [endpoint_id, capability_id, dispatch_group]
      properties:
        endpoint_id: {type: string}
        capability_id: {type: string}
        dispatch_group:
          oneOf:
            - {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
            - {type: 'null'}
    EffectiveSourceCatalog:
      type: object
      required: [revision, updated_at, selected_securities, subscriptions]
      properties:
        revision: {type: integer}
        updated_at: {type: string, format: date-time}
        selected_securities: {type: array, items: {type: string}}
        subscriptions:
          type: array
          items: {$ref: '#/components/schemas/EffectiveSourceSubscription'}
    EffectiveSourceSubscription:
      type: object
      required: [endpoint_id, publisher_id, platform, address, provider_id, credential_ref, capability_id, pipeline, dispatch_group, enabled, verification_status, settings, source]
      properties:
        endpoint_id: {type: string}
        publisher_id: {type: string}
        platform: {type: string, enum: [telegram, x, instagram, whatsapp, rss]}
        address: {type: string, description: Canonical endpoint handle, invitation URL, or fixed RSS feed URL.}
        provider_id:
          oneOf:
            - {type: string}
            - {type: 'null'}
          description: Stable provider identity when known; WhatsApp uses channel JID, Telegram uses numeric channel ID, and Stockbit uses its fixed lane ID.
        credential_ref:
          oneOf:
            - {type: string, pattern: '^credential:'}
            - {type: 'null'}
          description: Managed credential reference only; credential material is never returned.
        capability_id: {type: string}
        pipeline: {type: string}
        dispatch_group:
          oneOf:
            - {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
            - {type: 'null'}
        enabled: {type: boolean}
        verification_status: {type: string, enum: [verified, pending]}
        settings: {type: object}
        source: {type: string, enum: [endpoint_override, publisher_default, unset]}
    WatcherSummary:
      type: object
      additionalProperties: false
      required: [watcher_id, display_name, current_revision, updated_at]
      properties:
        watcher_id:
          type: string
        display_name:
          type: string
        current_revision:
          type: [integer, 'null']
        updated_at:
          type: string
          format: date-time
    ConfigWrite:
