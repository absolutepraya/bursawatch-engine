        display_name:
          type: string
        capabilities:
          type: array
          items:
            type: string
        pipeline_ids:
          type: array
          items:
            type: string
        config_resource_ids:
          type: array
          items:
            type: string
        related_component_ids:
          type: array
          items:
            type: string
        job_ids:
          type: array
          items:
            type: string
        source_gate:
          type: object
          additionalProperties: false
          required: [catalog_revision, capabilities]
          properties:
            catalog_revision:
              type: integer
            capabilities:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [capability_id, endpoint_count, enabled_endpoint_count]
                properties:
                  capability_id:
                    type: string
                  endpoint_count:
                    type: integer
                    minimum: 0
                  enabled_endpoint_count:
                    type: integer
                    minimum: 0
    SourceEventEnvelope:
      type: object
      additionalProperties: false
      required: [version, endpoint_id, publisher_id, platform, provider_event_id, published_at, observed_at, source_url, parser_version, content_hash, payload, media_refs, media_required]
      properties:
        version:
          type: integer
          const: 1
        endpoint_id:
          type: string
        publisher_id:
          type: string
        platform:
          type: string
          enum: [telegram, x, instagram, whatsapp, rss]
        provider_event_id:
          type: string
        published_at:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
        source_url:
          type: string
          format: uri
        parser_version:
          type: string
        content_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        payload:
          type: object
          description: Finite JSON, at most 64 KiB.
        media_refs:
          type: array
          maxItems: 16
          description: Stable opaque references returned by the Source Media Owner. Bytes and public or signed URLs are never stored in the event.
          items:
            type: object
            additionalProperties: false
            required: [ref, sha256, kind, content_type, size_bytes, filename, durable]
            properties:
              ref:
                type: string
                format: uuid
                description: Opaque identity resolved only by an authorized Source Media Owner client.
              sha256:
                type: string
                pattern: '^[0-9a-f]{64}$'
              kind:
                type: string
                enum: [image, video, document, audio]
              content_type:
                type: string
                enum: [image/jpeg, image/png, image/gif, image/webp, image/avif, video/mp4, video/quicktime, video/webm, application/pdf, application/zip, text/plain, audio/mpeg, audio/wav, audio/ogg, audio/flac, audio/mp4]
              size_bytes:
                type: integer
                minimum: 1
                maximum: 8388608
              filename:
                type: string
                pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
              durable:
                type: boolean
                enum: [true]
        media_required:
          type: boolean
          description: True when the normalized event depends on media. A true value requires at least one durable media ref.
    SourceCatalogConfig:
      type: object
      additionalProperties: false
      required: [selected_securities, people_org, endpoints, publisher_defaults, endpoint_overrides]
      properties:
        selected_securities:
          type: array
          uniqueItems: true
          items: {type: string}
        people_org:
          type: array
          items: {$ref: '#/components/schemas/PeopleOrgInput'}
        endpoints:
          type: array
          items: {$ref: '#/components/schemas/SourceEndpointInput'}
        publisher_defaults:
          type: array
          items: {$ref: '#/components/schemas/PublisherDefaultInput'}
        endpoint_overrides:
          type: array
          items: {$ref: '#/components/schemas/EndpointOverrideInput'}
    AssetReference:
      type: object
      additionalProperties: false
      required: [url, kind]
      properties:
        url: {type: string, format: uri, maxLength: 2048, pattern: '^https://'}
        kind: {type: string, enum: [logo, profile_picture, banner]}
    PeopleOrgInput:
      type: object
      additionalProperties: false
      required: [id, name, kind, asset_ref]
      properties:
