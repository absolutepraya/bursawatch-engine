        enabled:
          type: boolean
        interval_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          multipleOf: 60
        timezone:
          type: string
          const: Asia/Jakarta
          description: Bursawatch Hermes host timezone. It is fixed for interval jobs.
    ScheduleSnapshot:
      type: object
      additionalProperties: false
      required: [api_version, job_id, revision, enabled, interval_seconds, timezone, schedule_sha256, updated_at]
      properties:
        api_version:
          type: integer
          const: 1
        job_id:
          type: string
        revision:
          type: integer
          minimum: 1
        enabled:
          type: boolean
        interval_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          multipleOf: 60
        timezone:
          type: string
        schedule_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        updated_at:
          type: string
          format: date-time
    SchedulerReconciliation:
      type: object
      additionalProperties: false
      required: [status, applied_revision, last_error, effective]
      properties:
        status:
          type: string
          enum: [not_connected, pending, applied, error]
        applied_revision:
          type: [integer, 'null']
        last_error:
          type: [string, 'null']
          maxLength: 500
          description: Sanitized error from the latest guarded VPS reconciliation attempt.
        effective:
          type: boolean
          description: True only after the VPS reconciler confirms the current revision.
    ScheduleReconciliationWrite:
      type: object
      additionalProperties: false
      required: [revision, status]
      properties:
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [applied, error]
        error:
          type: [string, 'null']
          maxLength: 500
          description: Required only when status is error, and omitted or null when status is applied.
    SchedulerJob:
      type: object
      additionalProperties: false
      required: [job_id, watcher_id, component_ids, display_name, runtime_job_key, schedule_kind, min_interval_seconds, max_interval_seconds, schedule, can_edit, reconciliation]
      properties:
        job_id:
          type: string
        watcher_id:
          type: [string, 'null']
        component_ids:
          type: array
          items:
            type: string
        display_name:
          type: string
        runtime_job_key:
          type: string
        schedule_kind:
          type: string
          enum: [interval, fixed]
        min_interval_seconds:
          type: [integer, 'null']
        max_interval_seconds:
          type: [integer, 'null']
        schedule:
          oneOf:
            - $ref: '#/components/schemas/ScheduleSnapshot'
            - type: 'null'
        can_edit:
          type: boolean
          description: True only for an administrator and an interval job whose safe cadence controls are supported.
        reconciliation:
          $ref: '#/components/schemas/SchedulerReconciliation'
    ReconcilerSchedulerJob:
      type: object
      additionalProperties: false
      required: [job_id, watcher_id, display_name, runtime_job_key, schedule_kind, min_interval_seconds, max_interval_seconds, schedule, reconciliation]
      properties:
        job_id:
          type: string
        watcher_id:
          type: [string, 'null']
        display_name:
          type: string
        runtime_job_key:
          type: string
        schedule_kind:
          type: string
          const: interval
        min_interval_seconds:
          type: integer
          minimum: 60
          maximum: 86400
        max_interval_seconds:
          type: integer
          minimum: 60
          maximum: 86400
        schedule:
          $ref: '#/components/schemas/ScheduleSnapshot'
        reconciliation:
          $ref: '#/components/schemas/SchedulerReconciliation'
    ObservationWrite:
      type: object
      additionalProperties: false
      required: [api_version, identity_kind, identity_id, observed_at, status, evidence]
      properties:
        api_version:
          type: integer
          const: 1
        identity_kind:
          type: string
          const: job
        identity_id:
          type: string
          maxLength: 128
          description: Logical Control Plane job ID, not necessarily the Hermes runtime name.
        observed_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [enabled, disabled]
        evidence:
          type: object
          additionalProperties: false
          required: [runtime_job_key, enabled, schedule, last_execution]
          properties:
            runtime_job_key:
              type: string
              maxLength: 128
            enabled:
              type: boolean
            schedule:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [kind, minutes]
                  properties:
                    kind: {type: string, const: interval}
                    minutes: {type: integer, minimum: 1, maximum: 1440}
                - type: object
                  additionalProperties: false
                  required: [kind, expr]
                  properties:
                    kind: {type: string, const: cron}
                    expr: {type: string, maxLength: 100, pattern: '^[0-9*/?, -]+$'}
            last_execution:
              type: object
              additionalProperties: false
              required: [at, status]
              properties:
                at: {type: [string, 'null'], format: date-time}
                status: {type: [string, 'null'], enum: [success, failed, running, skipped, null]}
    Observation:
      allOf:
        - $ref: '#/components/schemas/ObservationWrite'
        - type: object
          required: [observer_id, received_at, freshness, comparison, desired, reconciliation]
          properties:
            observer_id: {type: string}
            received_at: {type: string, format: date-time}
            freshness: {type: string, enum: [fresh, stale]}
            comparison: {type: string, enum: [match, mismatch]}
            desired: {oneOf: [{'$ref': '#/components/schemas/ScheduleSnapshot'}, {type: 'null'}]}
            reconciliation: {'$ref': '#/components/schemas/SchedulerReconciliation'}
    ObservationAccepted:
      type: object
      required: [identity_kind, identity_id, observer_id, observed_at, received_at, status, evidence, freshness]
      properties:
        identity_kind: {type: string, const: job}
        identity_id: {type: string}
        observer_id: {type: string}
        observed_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        status: {type: string, enum: [enabled, disabled, stale]}
        evidence: {type: object}
        freshness: {type: string, enum: [fresh, stale]}
    Run:
      type: object
      additionalProperties: false
      required: [run_id, watcher_id, scheduler_job_id, trigger, config_revision, started_at, finished_at, status, error]
      properties:
        run_id:
          type: string
        watcher_id:
          type: string
        scheduler_job_id:
          type: [string, 'null']
        trigger:
          type: string
        config_revision:
          type: integer
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        status:
          type: string
          enum: [running, ok, degraded, failed, blocked]
        error:
          type: [string, 'null']
    RunStart:
      type: object
      additionalProperties: false
      required: [watcher_id, config_revision]
      properties:
        run_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        watcher_id:
          type: string
        config_revision:
          type: integer
          minimum: 1
        scheduler_job_id:
          type: [string, 'null']
        trigger:
          type: string
          default: scheduled
    RunEvent:
      type: object
      additionalProperties: false
      required: [run_id, event_id, occurred_at, level, phase, event_type, message, attributes]
      properties:
        run_id:
          type: string
        event_id:
          type: string
          minLength: 1
          maxLength: 128
        occurred_at:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warning, error, fatal]
        phase:
          type: string
          minLength: 1
          maxLength: 64
        event_type:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          maxLength: 500
        attributes:
          type: object
          description: JSON-safe structured fields, capped at 64 KiB by the service.
    RunEventWrite:
      type: object
      additionalProperties: false
      required: [event_id, occurred_at, level, phase, event_type, message]
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 128
        occurred_at:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warning, error, fatal]
        phase:
          type: string
          minLength: 1
          maxLength: 64
        event_type:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          maxLength: 500
        attributes:
          type: object
          description: JSON-safe structured fields, capped at 64 KiB by the service.
    RunFinish:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, failed, blocked]
        error:
          type: [string, 'null']
          maxLength: 500
    SourceEvidenceCapture:
      type: object
      additionalProperties: false
      required: [previous_cutoff, cutoff]
      properties:
        previous_cutoff:
          type: string
          format: date-time
          maxLength: 64
          description: Previous verified session cutoff, exclusive. Spans weekends and holidays.
        cutoff:
          type: string
          format: date-time
          maxLength: 64
          description: Current cutoff, inclusive; must be later than previous_cutoff.
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1000
    SourceEvidenceBatch:
      type: object
      additionalProperties: false
      required: [version_refs]
      properties:
        version_refs:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            maxLength: 256
            description: Opaque immutable version identity copied unchanged from the persisted manifest.
    SourceEvidenceManifest:
      type: object
      additionalProperties: false
      required: [api_version, previous_cutoff, cutoff, captured_at, capture_status, capture_gap_seconds, history_available_from, history_status, overflow, candidate_limit, complete, items, manifest_hash]
      properties:
        api_version:
          const: 1
        previous_cutoff:
          type: string
          format: date-time
        cutoff:
          type: string
          format: date-time
        captured_at:
          type: string
          format: date-time
        capture_status:
          enum: [early, on_time, late]
        capture_gap_seconds:
          type: number
          description: Signed capture time minus cutoff, including subsecond gaps.
        history_available_from:
          type: [string, 'null']
          format: date-time
          description: Verified deployment-owned retained-history boundary. Unset is unknown.
        history_status:
          enum: [unknown, available, unavailable]
        overflow:
          type: boolean
          description: More eligible candidates existed than the ceiling. No moving-query continuation.
        candidate_limit:
          type: integer
          minimum: 1
          maximum: 1000
        complete:
          type: boolean
          description: True only for on-time capture, available retained history and no overflow. Does not prove upstream intake completeness or full article text.
        manifest_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of UTF-8 sorted compact finite JSON manifest excluding this field.
        items:
          type: array
          maxItems: 1000
          description: Ordered by publication timestamp, event key and version. Text and media_refs omitted here.
          items:
            $ref: '#/components/schemas/SourceEvidenceItem'
    SourceEvidenceItem:
      type: object
      additionalProperties: false
      required: [event_key, version, kind, accepted_at, published_at, observed_at, endpoint_id, publisher_id, platform, source_url, parser_version, content_hash, payload_hash, original_publisher_id, origin_status, text_truncated, content_unavailable, evidence_hash, version_ref]
      properties:
        event_key:
          type: string
          pattern: '^[0-9a-f]{64}$'
        version:
          type: integer
          minimum: 1
        kind:
          enum: [original, correction, tombstone]
        accepted_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
        endpoint_id:
          type: string
        publisher_id:
          type: string
          description: Canonical collecting publisher; limits must span its routes and lanes.
        platform:
          enum: [telegram, x, instagram, whatsapp, rss]
        source_url:
          type: string
          format: uri
        parser_version:
          type: string
        content_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Adapter-owned content hash retained as provenance.
        payload_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the exact normalized accepted envelope, using sorted compact finite UTF-8 JSON.
        original_publisher_id:
          type: 'null'
          description: No verified original identity exists in the current strict envelope.
        origin_status:
          const: unknown
        text_truncated:
          type: boolean
        content_unavailable:
          type: boolean
        evidence_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the full safe item including text/media_refs, excluding evidence_hash and version_ref. Compare against the persisted manifest.
        version_ref:
          type: string
          maxLength: 256
        text:
          type: string
          maxLength: 12000
          description: Present only in version batches; safe known source text, no unrelated payload configuration.
        media_refs:
          type: array
          maxItems: 16
          description: Present only in version batches; durable opaque metadata, no private object URLs or media bytes.
          items:
            type: object
