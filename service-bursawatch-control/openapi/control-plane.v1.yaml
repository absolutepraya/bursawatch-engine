openapi: 3.1.0
info:
  title: Bursawatch Control Plane API
  version: 1.0.0
  description: Configuration and structured run observability for Bursawatch.
servers:
  - url: https://api.example.invalid
security:
  - bearerAuth: []
paths:
  /v1/source-evidence/capture:
    post:
      summary: Capture a bounded immutable source-version manifest without claiming work.
      description: Dedicated source_reader or admin only. Uses one read-only repeatable-read snapshot. The owner must persist this manifest before selecting evidence. Highest accepted/observed eligible versions are selected before the publication window; selected tombstones are omitted. Early/late capture, unknown/unavailable history and overflow are incomplete. Does not reproduce earlier committed-state visibility on a late capture.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceEvidenceCapture'
      responses:
        '200':
          description: Deterministically ordered immutable identities and honest capture availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceEvidenceManifest'
        '403':
          description: Dedicated source-reader or admin role required.
        '422':
          description: Invalid timezone-aware window or candidate bound.
  /v1/source-evidence/versions:
    post:
      summary: Read explicit immutable source versions from a persisted manifest.
      description: Dedicated source_reader or admin only. All requested references must be unique and retain their envelope hashes. Returns requested order; no partial batch, moving timestamp query, latest-version fallback or work mutation. Consumers compare evidence_hash with the persisted manifest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceEvidenceBatch'
      responses:
        '200':
          description: Safe bounded text and opaque durable media metadata for every requested version.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [api_version, items]
                properties:
                  api_version:
                    const: 1
                  items:
                    type: array
                    minItems: 1
                    maxItems: 100
                    items:
                      allOf:
                        - $ref: '#/components/schemas/SourceEvidenceItem'
                        - required: [text, media_refs]
        '403':
          description: Dedicated source-reader or admin role required.
        '410':
          description: At least one immutable version is unavailable. Evidence is incomplete.
        '422':
          description: Invalid, duplicate, over-bound or integrity-mismatched references.
  /v1/components:
    get:
      summary: List the versioned declared component inventory.
      description: Signed-in viewer or admin only. Adapter source gates are summarized from the current effective Source Catalog; publisher and endpoint settings are not duplicated in this inventory.
      responses:
        '200':
          description: Versioned components, stable relationships, and catalog-derived source gate summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentInventory'
        '403':
          description: Machine and other non-human principals are denied.
  /v1/components/{component_id}:
    parameters:
      - name: component_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]*$'
    get:
      summary: Read one declared component.
      description: Signed-in viewer or admin only. Adapter source gates are summarized from the current effective Source Catalog.
      responses:
        '200':
          description: Component declaration and optional catalog-derived source gate summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
        '403':
          description: Machine and other non-human principals are denied.
        '404':
          description: Component is not declared in this inventory version.
  /v1/components/{component_id}/activity:
    parameters:
      - name: component_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Read bounded Source Inbox activity for one declared component.
      description: Signed-in viewer or admin only. Acceptance and work timestamps do not establish fetch, owner success, or Discord delivery. Missing evidence is unknown.
      responses:
        '200':
          description: Source endpoint and pipeline activity without raw payloads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentActivity'
        '403':
          description: Machine and other non-human principals are denied.
        '404':
          description: Component is not declared in this inventory version.
  /v1/publications:
    get:
      summary: List confirmed publications after the recorded cutover.
      description: Signed-in viewer or admin only. Results are ordered by delivery confirmation time, opaque publication ID, and version, all descending. Filters are applied before cursor advancement. An empty page does not prove coverage.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 2048}}
        - {name: group, in: query, schema: {type: string, enum: [news, swing]}}
        - {name: type, in: query, schema: {type: string, maxLength: 200}}
        - {name: route, in: query, schema: {type: string, maxLength: 200}}
        - {name: date_from, in: query, schema: {type: string, format: date-time}}
        - {name: date_to, in: query, schema: {type: string, format: date-time}}
        - {name: source, in: query, schema: {type: string, maxLength: 200}}
        - {name: ticker, in: query, schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: Bounded page of sanitized published snapshots.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationPage'}
        '403': {description: Machine principals are denied.}
        '422': {description: Invalid query or cursor.}
    post:
      summary: Accept one confirmed owner publication snapshot.
      description: Publication owner credential only. Owner identity comes from the bearer token, never the body. Same key and digest are idempotent; conflicting versions are refused. The Control Plane does not send to Discord.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublicationWrite'}
      responses:
        '202':
          description: Immutable publication version accepted or already present.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationAck'}
        '403': {description: Caller is not a publication owner.}
        '409': {description: Cutover inactive or publication key/version conflict.}
        '422': {description: Invalid, incomplete, or pre-cutover snapshot.}
  /v1/publications/checkpoints:
    post:
      summary: Record one owner's bounded projection comparison.
      description: Publication owner credential only. An older comparison cannot replace a newer one. Reporting a checkpoint never resends Discord output.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublicationCheckpoint'}
      responses:
        '202':
          description: Accepted or previously stored monotonic checkpoint.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationCheckpoint'}
        '403': {description: Caller is not a publication owner.}
        '409': {description: Cutover inactive or same-time comparison conflict.}
        '422': {description: Invalid comparison or owner is outside cutover.}
  /v1/publications/coverage:
    get:
      summary: Read cutover and per-owner projection coverage.
      description: Signed-in viewer or admin only. Missing or stale checkpoints are unknown, and all-publisher completion requires every cutover owner. Fresh disabled-job observations may mark an owner paused or unverified.
      responses:
        '200':
          description: Forward-only cutover and owner coverage.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationCoverage'}
        '403': {description: Machine principals are denied.}
  /v1/publications/{publication_id}:
    parameters:
      - name: publication_id
        in: path
        required: true
        schema: {type: string, pattern: '^[0-9a-f]{64}$'}
    get:
      summary: Read immutable versions and linked publications.
      description: Signed-in viewer or admin only.
      responses:
        '200':
          description: Exact confirmed output snapshots for this publication.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationDetail'}
        '403': {description: Machine principals are denied.}
        '404': {description: Publication is missing.}
  /v1/source-events:
    post:
      summary: Accept a version 1 normalized source event durably.
      description: Machine or admin credential. Duplicate provider identities return the original receipt; conflicting content requires an audited correction. Acceptance and frozen work insertion share a transaction. Compatible enabled X subscriptions in the x_post_route group create one work item. Media refs are opaque IDs returned by the private Source Media Owner, with bounded verified metadata only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelope]
              properties:
                envelope:
                  $ref: '#/components/schemas/SourceEventEnvelope'
      responses:
        '200':
          description: Durable acceptance receipt with event key, version, duplicate flag, and work keys.
        '409':
          description: Provider identity conflicts with the accepted original.
        '422':
          description: Invalid endpoint identity, envelope, or media dependency.
  /v1/source-events/{event_key}:
    get:
      summary: Inspect source event versions and all subscription work.
      description: Machine or admin credential. Includes bounded source payload and must not be logged routinely.
      responses:
        '200':
          description: Event history and work state.
        '404':
          description: Unknown event key.
  /v1/source-events/{event_key}/versions:
    post:
      summary: Append an audited correction or deletion tombstone.
      description: Human admin or credential scoped to the originating endpoint. A stable revision_id returns the original receipt on retries, including a later observed_at. Older leased or executing work, even past its lease deadline, blocks a new revision with retryable 409 and no version append. Claims, begin-execution, and revisions lock the same event row. Original subscription targets and config snapshots remain frozen. A tombstone is terminal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [envelope, kind, revision_id, reason]
              properties:
                envelope:
                  $ref: '#/components/schemas/SourceEventEnvelope'
                kind:
                  type: string
                  enum: [correction, tombstone]
                revision_id:
                  type: string
                  maxLength: 128
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: New immutable version and work keys.
  /v1/source-work:
    get:
      summary: Inspect subscription work by status.
      description: Machine or admin credential. Query status and bounded limit.
      responses:
        '200':
          description: Work items with frozen catalog and capability revisions.
  /v1/source-work/claim:
    post:
      summary: Claim available subscription work with expiring leases.
      description: Worker machine or admin credential. A required pipeline_ids filter limits claims to supported handlers. Only the newest event version can be claimed. Claiming increments the per-item attempt count; each work item carries a stable effect key for domain-owner deduplication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pipeline_ids]
              properties:
                pipeline_ids:
                  type: array
                  minItems: 1
                  maxItems: 32
                  uniqueItems: true
                  items:
                    type: string
      responses:
        '200':
          description: Claimed work with envelope and lease token.
  /v1/source-work/{work_key}/settle:
    post:
      summary: Settle a current lease, or schedule a bounded retry.
      description: Machine or admin credential. Failure accepts a sanitized error code only; five failed attempts dead-letter the item.
      responses:
        '200':
          description: Updated work item.
        '409':
          description: Lease expired or token mismatched.
  /v1/source-work/{work_key}/begin:
    post:
      summary: Atomically begin execution under a valid lease.
      description: Worker machine or admin credential. A handler must not run unless this returns begun true. Executing work remains fenced without automatic expiry until settlement or audited recovery.
      responses:
        '200':
          description: Object with boolean begun.
  /v1/source-work/{work_key}/fence:
    post:
      summary: Check a lease against the latest event version before dispatch.
      description: Worker machine or admin credential. This check reduces stale dispatch but a revision may still arrive while the handler executes; domain owners must atomically enforce monotonic event versions with effect idempotency.
      responses:
        '200':
          description: Object with boolean current.
  /v1/source-work/{work_key}/suppress:
    post:
      summary: Suppress idle work with an audited reason.
      description: Human admin only. Disabling a catalog subscription never suppresses accepted work automatically.
      responses:
        '200':
          description: Suppressed work item.
  /v1/source-work/{work_key}/replay:
    post:
      summary: Replay suppressed or dead-letter work with an audited reason.
      description: Human admin only. The effect key is unchanged so the domain owner can deduplicate an earlier effect.
      responses:
        '200':
          description: Pending work item.
  /v1/source-work/{work_key}/recover:
    post:
      summary: Auditably recover uncertain executing work to dead-letter.
      description: Human admin only. Requires worker_stopped true after operator verification that the old process has terminated, plus a bounded reason. No automatic retry occurs.
      responses:
        '200':
          description: Dead-letter work item.
  /v1/source-catalog:
    get:
      summary: List the engine registry and active catalog configuration.
      description: Signed-in admin or viewer only. `can_edit` is derived from the authenticated backend principal. Securities, capabilities, tiers, compatibility, and system endpoints are engine-owned. People and endpoints from the active revision are included.
      responses:
        '200':
          description: Registry and active configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceCatalog'
  /v1/source-catalog/effective:
    get:
      summary: Read machine-readable effective subscriptions.
      description: Admin, viewer, and machine credentials may read this resolved snapshot. Endpoint overrides take precedence over publisher defaults.
      responses:
        '200':
          description: Resolved source configuration revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveSourceCatalog'
  /v1/source-catalog/config:
    put:
      summary: Write an optimistic source catalog revision.
      description: Human admin operation. Does not change watcher configuration, schedule, cursors, or live source state. Credentials are managed references only. User endpoints remain unverified until separately reviewed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, config]
              properties:
                expected_revision:
                  type: integer
                  minimum: 1
                config:
                  $ref: '#/components/schemas/SourceCatalogConfig'
      responses:
        '200':
          description: Stored revision and checksum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceCatalogRevision'
        '409':
          description: Expected revision is stale.
        '422':
          description: Field or compatibility validation failed.
  /healthz:
    get:
      security: []
      responses:
        '200':
          description: Service is reachable.
  /v1/watchers/{watcher_id}/config:
    parameters:
      - $ref: '#/components/parameters/WatcherId'
    get:
      summary: Read the active configuration snapshot.
      responses:
        '200':
          description: Active snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSnapshot'
        '404':
          description: Watcher has no active configuration.
    put:
      summary: Write a validated configuration revision.
      description: Human admin operation. The server validates the watcher payload before storing it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigWrite'
      responses:
        '200':
          description: New active snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSnapshot'
        '422':
          description: Watcher-specific validation failed.
  /v1/watchers/{watcher_id}/profiles:
    parameters:
      - $ref: '#/components/parameters/WatcherId'
    get:
      summary: Read current watched profiles and their avatar metadata.
      description: Profile avatar metadata is stored separately from the strict watcher configuration snapshot.
      responses:
        '200':
          description: Current profiles in stable profile-ID order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileAvatar'
        '404':
          description: Watcher has no active configuration.
  /v1/watchers/{watcher_id}/profiles/{profile_id}/avatar:
    parameters:
      - $ref: '#/components/parameters/WatcherId'
      - $ref: '#/components/parameters/ProfileId'
    put:
      summary: Set a profile avatar to automatic or manual mode.
      description: Manual mode stores an administrator-supplied HTTPS URL. Automatic mode refreshes from RSSHub and safe profile metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarWrite'
      responses:
        '200':
          description: Updated profile avatar metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAvatar'
        '404':
          description: Profile does not exist in the current watcher configuration.
  /v1/watchers/{watcher_id}/profiles/{profile_id}/avatar/refresh:
    parameters:
      - $ref: '#/components/parameters/WatcherId'
      - $ref: '#/components/parameters/ProfileId'
    post:
      summary: Queue an immediate automatic avatar refresh.
      description: The refresh is best effort and keeps the previous URL when the provider is unavailable.
      responses:
        '200':
          description: Current profile avatar metadata. The queued result may be visible on a later read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAvatar'
        '404':
          description: Profile does not exist in the current watcher configuration.
  /v1/watchers:
    get:
      summary: List registered watchers and active revisions.
      responses:
        '200':
          description: Registered watchers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatcherSummary'
  /v1/watchers/{watcher_id}/runs:
    parameters:
      - $ref: '#/components/parameters/WatcherId'
    get:
      summary: List recent watcher runs.
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recent runs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Run'
  /v1/watchers/{watcher_id}/events:
    parameters:
      - $ref: '#/components/parameters/WatcherId'
    get:
      summary: Read a watcher's newest structured events across runs.
      parameters:
        - $ref: '#/components/parameters/EventLimit'
      responses:
        '200':
          description: Structured events in reverse chronological order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunEvent'
  /v1/watchers/{watcher_id}/jobs:
    parameters:
      - $ref: '#/components/parameters/WatcherId'
    get:
      summary: List a watcher's scheduler jobs and desired schedule state.
      description: A desired schedule is not effective until a VPS reconciler reports it applied.
      responses:
        '200':
          description: Scheduler jobs in stable job-ID order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchedulerJob'
  /v1/jobs:
    get:
      summary: List the global declared scheduler job inventory.
      description: Signed-in viewer or admin only. Each shared job appears once and links to every declared component that uses it. An optional component_id filter returns only jobs linked to that component.
      parameters:
        - name: component_id
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]*$'
      responses:
        '200':
          description: Scheduler jobs in stable job-ID order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchedulerJob'
        '422':
          description: Unknown component filter.
  /v1/internal/observations:
    post:
      summary: Submit a bounded Hermes job observation.
      description: Dedicated observer principal only. The server derives observer identity from its credential. This role cannot write desired schedules, configurations, cursors, or publications.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationWrite'
      responses:
        '202':
          description: Accepted observation, or the newer stored observation when the report was out of order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationAccepted'
        '403':
          description: Credential is not scoped to the Hermes observer.
        '422':
          description: Unknown job, malformed evidence, or unsafe values.
  /v1/observations:
    get:
      summary: Read bounded latest job observations.
      description: Signed-in viewer or admin only. Each record keeps received time, freshness, desired state, reconciliation state, and live schedule comparison separate. Repeated job_id filters return only selected declared jobs; omitting the filter returns all observations.
      parameters:
        - name: job_id
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            uniqueItems: true
            items:
              type: string
              pattern: '^[a-z0-9][a-z0-9-]*$'
      responses:
        '200':
          description: Latest safe observation summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Observation'
        '422':
          description: Unknown, duplicate, or excessive job filters.
        '403':
          description: Machine principals are denied.
  /v1/jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      summary: Read one global scheduler job record.
      description: Signed-in viewer or admin only. Desired, reconciled, and observed state remain separate.
      responses:
        '200':
          description: Scheduler job state and component relationships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerJob'
        '404':
          description: Scheduler job does not exist.
  /v1/jobs/{job_id}/schedule:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      summary: Read a scheduler job and its desired schedule state.
      responses:
        '200':
          description: Scheduler job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerJob'
        '404':
          description: Scheduler job does not exist.
    put:
      summary: Store a new desired schedule revision for an interval job.
      description: Human admin operation. This persists intent only and never directly mutates Hermes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleWrite'
      responses:
        '200':
          description: New desired schedule revision, pending VPS reconciliation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerJob'
        '422':
          description: The job has a fixed source-defined schedule or the cadence is outside its approved policy.
  /v1/internal/schedules:
    get:
      summary: Read every desired interval schedule for the trusted VPS reconciler.
      description: Reconciler credential only. This route is not available to browser, admin, or cron machine credentials.
      responses:
        '200':
          description: Reconcilable scheduler jobs in stable job-ID order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReconcilerSchedulerJob'
  /v1/internal/jobs/{job_id}/reconciliation:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      summary: Record a verified VPS reconciliation outcome for the current desired revision.
      description: Reconciler credential only. A stale revision is rejected and cannot become effective.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleReconciliationWrite'
      responses:
        '200':
          description: Current desired schedule with its reconciled outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerJob'
        '409':
          description: The job is fixed or the desired schedule revision changed before reporting.
  /v1/runs/{run_id}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      summary: Read the structured event timeline for a run.
      parameters:
        - $ref: '#/components/parameters/EventLimit'
      responses:
        '200':
          description: Run events in occurrence order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunEvent'
    post:
      summary: Append an idempotent structured event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunEventWrite'
      responses:
        '201':
          description: Stored event.
  /v1/runs:
    post:
      summary: Start a cron run record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunStart'
      responses:
        '201':
          description: Created run.
  /v1/runs/{run_id}/finish:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      summary: Finish a cron run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunFinish'
      responses:
        '200':
          description: Updated run.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    WatcherId:
      name: watcher_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]*$'
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]*$'
    ProfileId:
      name: profile_id
      in: path
