        endpoints:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [endpoint_id, accepted_at, status, meaning]
            properties:
              endpoint_id: {type: string}
              accepted_at: {type: [string, 'null'], format: date-time}
              status: {type: string, enum: [unknown, stale, observed]}
              meaning: {type: string, const: last accepted into Source Inbox}
        pipelines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [pipeline_id, work_created_at, work_status, status, meaning]
            properties:
              pipeline_id: {type: string}
              work_created_at: {type: [string, 'null'], format: date-time}
              work_status: {type: [string, 'null']}
              status: {type: string, enum: [unknown, stale, observed]}
              meaning: {type: string, const: last pipeline work}
    ComponentInventory:
      type: object
      additionalProperties: false
