            $ref: '#/components/schemas/Component'
    Component:
      type: object
      additionalProperties: false
      required: [inventory_version, component_id, kind, display_name, capabilities, pipeline_ids, config_resource_ids, related_component_ids, job_ids]
      properties:
        inventory_version:
          type: integer
          const: 1
        component_id:
