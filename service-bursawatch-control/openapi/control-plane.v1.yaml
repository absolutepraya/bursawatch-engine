            properties:
              owner_id: {type: string}
              status: {type: string, enum: [complete, lagging, unknown, paused/unverified]}
              checkpoint:
                oneOf:
                  - {type: 'null'}
                  - {$ref: '#/components/schemas/PublicationCheckpoint'}
    ComponentActivity:
      type: object
