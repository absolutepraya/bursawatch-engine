        board_episode_id: {type: [string, 'null']}
        config_revision: {type: [integer, 'null']}
        renderer_version: {type: string, minLength: 1, maxLength: 100}
        source_version: {type: [string, 'null'], maxLength: 100}
        required_operation_keys: {type: array, minItems: 1, maxItems: 64, items: {type: string}}
        legs: {type: array, minItems: 1, maxItems: 64, items: {$ref: '#/components/schemas/PublicationLeg'}}
    Publication:
      type: object
