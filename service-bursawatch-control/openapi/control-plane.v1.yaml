openapi: 3.1.0
info:
  title: Bursawatch Control Plane API
  version: 1.0.0
  description: Configuration and structured run observability for Bursawatch.
servers:
  - url: https://api.example.invalid
security:
  - bearerAuth: []
paths:
  /v1/source-events:
    post:
      summary: Accept a version 1 normalized source event durably.
      description: Machine or admin credential. Duplicate provider identities return the original receipt; conflicting content requires an audited correction. Acceptance and per-subscription work insertion share a transaction. Media refs are currently rejected until durable object storage is reviewed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelope]
              properties:
                envelope:
                  $ref: '#/components/schemas/SourceEventEnvelope'
      responses:
        '200':
          description: Durable acceptance receipt with event key, version, duplicate flag, and work keys.
        '409':
          description: Provider identity conflicts with the accepted original.
        '422':
          description: Invalid endpoint identity, envelope, or media dependency.
  /v1/source-events/{event_key}:
    get:
      summary: Inspect source event versions and all subscription work.
      description: Machine or admin credential. Includes bounded source payload and must not be logged routinely.
      responses:
        '200':
          description: Event history and work state.
        '404':
          description: Unknown event key.
  /v1/source-events/{event_key}/versions:
    post:
      summary: Append an audited correction or deletion tombstone.
      description: Human admin or credential scoped to the originating endpoint. A stable revision_id returns the original receipt on retries, including a later observed_at. Older leased or executing work, even past its lease deadline, blocks a new revision with retryable 409 and no version append. Claims, begin-execution, and revisions lock the same event row. Original subscription targets and config snapshots remain frozen. A tombstone is terminal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [envelope, kind, revision_id, reason]
              properties:
                envelope:
                  $ref: '#/components/schemas/SourceEventEnvelope'
                kind:
                  type: string
                  enum: [correction, tombstone]
                revision_id:
                  type: string
                  maxLength: 128
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: New immutable version and work keys.
  /v1/source-work:
    get:
      summary: Inspect subscription work by status.
      description: Machine or admin credential. Query status and bounded limit.
      responses:
        '200':
          description: Work items with frozen catalog and capability revisions.
  /v1/source-work/claim:
    post:
      summary: Claim available subscription work with expiring leases.
      description: Worker machine or admin credential. A required pipeline_ids filter limits claims to supported handlers. Only the newest event version can be claimed. Claiming increments the per-item attempt count; each work item carries a stable effect key for domain-owner deduplication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pipeline_ids]
              properties:
                pipeline_ids:
                  type: array
                  minItems: 1
                  maxItems: 32
                  uniqueItems: true
                  items:
                    type: string
      responses:
        '200':
          description: Claimed work with envelope and lease token.
  /v1/source-work/{work_key}/settle:
    post:
      summary: Settle a current lease, or schedule a bounded retry.
      description: Machine or admin credential. Failure accepts a sanitized error code only; five failed attempts dead-letter the item.
      responses:
        '200':
          description: Updated work item.
        '409':
          description: Lease expired or token mismatched.
  /v1/source-work/{work_key}/begin:
    post:
      summary: Atomically begin execution under a valid lease.
      description: Worker machine or admin credential. A handler must not run unless this returns begun true. Executing work remains fenced without automatic expiry until settlement or audited recovery.
      responses:
        '200':
          description: Object with boolean begun.
  /v1/source-work/{work_key}/fence:
    post:
      summary: Check a lease against the latest event version before dispatch.
      description: Worker machine or admin credential. This check reduces stale dispatch but a revision may still arrive while the handler executes; domain owners must atomically enforce monotonic event versions with effect idempotency.
      responses:
        '200':
          description: Object with boolean current.
  /v1/source-work/{work_key}/suppress:
    post:
      summary: Suppress idle work with an audited reason.
      description: Human admin only. Disabling a catalog subscription never suppresses accepted work automatically.
      responses:
        '200':
          description: Suppressed work item.
  /v1/source-work/{work_key}/replay:
    post:
      summary: Replay suppressed or dead-letter work with an audited reason.
      description: Human admin only. The effect key is unchanged so the domain owner can deduplicate an earlier effect.
      responses:
        '200':
          description: Pending work item.
  /v1/source-work/{work_key}/recover:
    post:
      summary: Auditably recover uncertain executing work to dead-letter.
      description: Human admin only. Requires worker_stopped true after operator verification that the old process has terminated, plus a bounded reason. No automatic retry occurs.
      responses:
        '200':
          description: Dead-letter work item.
  /v1/source-catalog:
    get:
      summary: List the engine registry and active catalog configuration.
      description: Signed-in admin or viewer only. `can_edit` is derived from the authenticated backend principal. Securities, capabilities, tiers, compatibility, and system endpoints are engine-owned. People and endpoints from the active revision are included.
      responses:
        '200':
          description: Registry and active configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceCatalog'
  /v1/source-catalog/effective:
    get:
      summary: Read machine-readable effective subscriptions.
      description: Admin, viewer, and machine credentials may read this resolved snapshot. Endpoint overrides take precedence over publisher defaults.
      responses:
        '200':
          description: Resolved source configuration revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveSourceCatalog'
  /v1/source-catalog/config:
    put:
      summary: Write an optimistic source catalog revision.
      description: Human admin operation. Does not change watcher configuration, schedule, cursors, or live source state. Credentials are managed references only. User endpoints remain unverified until separately reviewed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, config]
              properties:
                expected_revision:
                  type: integer
                  minimum: 1
                config:
                  $ref: '#/components/schemas/SourceCatalogConfig'
      responses:
        '200':
          description: Stored revision and checksum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceCatalogRevision'
        '409':
          description: Expected revision is stale.
        '422':
          description: Field or compatibility validation failed.
  /healthz:
    get:
      security: []
      responses:
        '200':
          description: Service is reachable.
  /v1/watchers/{watcher_id}/config:
    parameters:
      - $ref: '#/components/parameters/WatcherId'
    get:
      summary: Read the active configuration snapshot.
      responses:
        '200':
          description: Active snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSnapshot'
        '404':
          description: Watcher has no active configuration.
    put:
      summary: Write a validated configuration revision.
      description: Human admin operation. The server validates the watcher payload before storing it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigWrite'
      responses:
        '200':
          description: New active snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSnapshot'
        '422':
          description: Watcher-specific validation failed.
  /v1/watchers/{watcher_id}/profiles:
    parameters:
      - $ref: '#/components/parameters/WatcherId'
    get:
      summary: Read current watched profiles and their avatar metadata.
      description: Profile avatar metadata is stored separately from the strict watcher configuration snapshot.
      responses:
        '200':
          description: Current profiles in stable profile-ID order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileAvatar'
        '404':
          description: Watcher has no active configuration.
  /v1/watchers/{watcher_id}/profiles/{profile_id}/avatar:
    parameters:
      - $ref: '#/components/parameters/WatcherId'
      - $ref: '#/components/parameters/ProfileId'
    put:
      summary: Set a profile avatar to automatic or manual mode.
      description: Manual mode stores an administrator-supplied HTTPS URL. Automatic mode refreshes from RSSHub and safe profile metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarWrite'
      responses:
        '200':
          description: Updated profile avatar metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAvatar'
        '404':
          description: Profile does not exist in the current watcher configuration.
  /v1/watchers/{watcher_id}/profiles/{profile_id}/avatar/refresh:
    parameters:
      - $ref: '#/components/parameters/WatcherId'
      - $ref: '#/components/parameters/ProfileId'
    post:
      summary: Queue an immediate automatic avatar refresh.
      description: The refresh is best effort and keeps the previous URL when the provider is unavailable.
      responses:
        '200':
          description: Current profile avatar metadata. The queued result may be visible on a later read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAvatar'
        '404':
          description: Profile does not exist in the current watcher configuration.
  /v1/watchers:
    get:
      summary: List registered watchers and active revisions.
      responses:
        '200':
          description: Registered watchers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatcherSummary'
  /v1/watchers/{watcher_id}/runs:
    parameters:
      - $ref: '#/components/parameters/WatcherId'
    get:
      summary: List recent watcher runs.
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recent runs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Run'
  /v1/watchers/{watcher_id}/events:
    parameters:
      - $ref: '#/components/parameters/WatcherId'
    get:
      summary: Read a watcher's newest structured events across runs.
      parameters:
        - $ref: '#/components/parameters/EventLimit'
      responses:
        '200':
          description: Structured events in reverse chronological order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunEvent'
  /v1/watchers/{watcher_id}/jobs:
    parameters:
      - $ref: '#/components/parameters/WatcherId'
    get:
      summary: List a watcher's scheduler jobs and desired schedule state.
      description: A desired schedule is not effective until a VPS reconciler reports it applied.
      responses:
        '200':
          description: Scheduler jobs in stable job-ID order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchedulerJob'
  /v1/jobs/{job_id}/schedule:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      summary: Read a scheduler job and its desired schedule state.
      responses:
        '200':
          description: Scheduler job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerJob'
        '404':
          description: Scheduler job does not exist.
    put:
      summary: Store a new desired schedule revision for an interval job.
      description: Human admin operation. This persists intent only and never directly mutates Hermes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleWrite'
      responses:
        '200':
          description: New desired schedule revision, pending VPS reconciliation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerJob'
        '409':
          description: The job has a fixed source-defined schedule.
        '422':
          description: The cadence is outside the job's approved policy.
  /v1/internal/schedules:
    get:
      summary: Read every desired interval schedule for the trusted VPS reconciler.
      description: Reconciler credential only. This route is not available to browser, admin, or cron machine credentials.
      responses:
        '200':
          description: Reconcilable scheduler jobs in stable job-ID order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchedulerJob'
  /v1/internal/jobs/{job_id}/reconciliation:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      summary: Record a verified VPS reconciliation outcome for the current desired revision.
      description: Reconciler credential only. A stale revision is rejected and cannot become effective.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleReconciliationWrite'
      responses:
        '200':
          description: Current desired schedule with its reconciled outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerJob'
        '409':
          description: The job is fixed or the desired schedule revision changed before reporting.
  /v1/runs/{run_id}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      summary: Read the structured event timeline for a run.
      parameters:
        - $ref: '#/components/parameters/EventLimit'
      responses:
        '200':
          description: Run events in occurrence order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunEvent'
    post:
      summary: Append an idempotent structured event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunEventWrite'
      responses:
        '201':
          description: Stored event.
  /v1/runs:
    post:
      summary: Start a cron run record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunStart'
      responses:
        '201':
          description: Created run.
  /v1/runs/{run_id}/finish:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      summary: Finish a cron run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunFinish'
      responses:
        '200':
          description: Updated run.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    WatcherId:
      name: watcher_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]*$'
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]*$'
    ProfileId:
      name: profile_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    EventLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 500
  schemas:
    SourceEventEnvelope:
      type: object
      additionalProperties: false
      required: [version, endpoint_id, publisher_id, platform, provider_event_id, published_at, observed_at, source_url, parser_version, content_hash, payload, media_refs, media_required]
      properties:
        version:
          type: integer
          const: 1
        endpoint_id:
          type: string
        publisher_id:
          type: string
        platform:
          type: string
          enum: [telegram, x, instagram, whatsapp, rss]
        provider_event_id:
          type: string
        published_at:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
        source_url:
          type: string
          format: uri
        parser_version:
          type: string
        content_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        payload:
          type: object
          description: Finite JSON, at most 64 KiB.
        media_refs:
          type: array
          maxItems: 16
          description: Currently must be empty until durable storage is approved.
        media_required:
          type: boolean
    SourceCatalogConfig:
      type: object
      additionalProperties: false
      required: [selected_securities, people_org, endpoints, publisher_defaults, endpoint_overrides]
      properties:
        selected_securities:
          type: array
          uniqueItems: true
          items: {type: string}
        people_org:
          type: array
          items: {$ref: '#/components/schemas/PeopleOrgInput'}
        endpoints:
          type: array
          items: {$ref: '#/components/schemas/SourceEndpointInput'}
        publisher_defaults:
          type: array
          items: {$ref: '#/components/schemas/PublisherDefaultInput'}
        endpoint_overrides:
          type: array
          items: {$ref: '#/components/schemas/EndpointOverrideInput'}
    AssetReference:
      type: object
      additionalProperties: false
      required: [url, kind]
      properties:
        url: {type: string, format: uri, maxLength: 2048, pattern: '^https://'}
        kind: {type: string, enum: [logo, profile_picture, banner]}
    PeopleOrgInput:
      type: object
      additionalProperties: false
      required: [id, name, kind, asset_ref]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,63}$'}
        name: {type: string, minLength: 1, maxLength: 120}
        kind: {type: string, enum: [person, group, community]}
        asset_ref:
          oneOf:
            - {$ref: '#/components/schemas/AssetReference'}
            - {type: 'null'}
    SourceEndpointInput:
      type: object
      additionalProperties: false
      required: [id, publisher_id, platform, address, credential_ref]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,63}$'}
        publisher_id: {type: string}
        platform: {type: string, enum: [telegram, x, instagram, whatsapp]}
        address: {type: string, pattern: '^[A-Za-z0-9_.]{1,64}$'}
        credential_ref:
          oneOf:
            - {type: string, pattern: '^credential:[a-z0-9][a-z0-9-]{1,63}$'}
            - {type: 'null'}
    PublisherDefaultInput:
      type: object
      additionalProperties: false
      required: [publisher_id, capability_id, enabled, settings]
      properties:
        publisher_id: {type: string}
        capability_id: {type: string}
        enabled: {type: boolean}
        settings: {type: object, maxProperties: 0}
    EndpointOverrideInput:
      type: object
      additionalProperties: false
      required: [endpoint_id, capability_id, enabled, settings]
      properties:
        endpoint_id: {type: string}
        capability_id: {type: string}
        enabled: {type: boolean}
        settings: {type: object, maxProperties: 0}
    SourceCatalogRevision:
      type: object
      required: [revision, config, sha256, actor_id, updated_at]
      properties:
        revision: {type: integer}
        config: {$ref: '#/components/schemas/SourceCatalogConfig'}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        actor_id: {type: string}
        updated_at: {type: string, format: date-time}
    SourceCatalog:
      type: object
      required: [securities, institutions, people_org, endpoints, capabilities, compatibility, config, can_edit]
      properties:
        securities: {type: array, items: {type: object}}
        institutions: {type: array, items: {type: object}}
        people_org: {type: array, items: {type: object}}
        endpoints: {type: array, items: {type: object}}
        capabilities: {type: array, items: {type: object}}
        compatibility: {type: array, items: {type: object}}
        config: {$ref: '#/components/schemas/SourceCatalogRevision'}
        can_edit: {type: boolean, description: True only for an authenticated admin user.}
    EffectiveSourceCatalog:
      type: object
      required: [revision, updated_at, selected_securities, subscriptions]
      properties:
        revision: {type: integer}
        updated_at: {type: string, format: date-time}
        selected_securities: {type: array, items: {type: string}}
        subscriptions:
          type: array
          items: {$ref: '#/components/schemas/EffectiveSourceSubscription'}
    EffectiveSourceSubscription:
      type: object
      required: [endpoint_id, publisher_id, platform, address, provider_id, credential_ref, capability_id, pipeline, enabled, verification_status, settings, source]
      properties:
        endpoint_id: {type: string}
        publisher_id: {type: string}
        platform: {type: string, enum: [telegram, x, instagram, whatsapp, rss]}
        address: {type: string, description: Canonical endpoint handle, invitation URL, or fixed RSS feed URL.}
        provider_id:
          oneOf:
            - {type: string}
            - {type: 'null'}
          description: Stable provider identity when known; WhatsApp uses channel JID, Telegram uses numeric channel ID, and Stockbit uses its fixed lane ID.
        credential_ref:
          oneOf:
            - {type: string, pattern: '^credential:'}
            - {type: 'null'}
          description: Managed credential reference only; credential material is never returned.
        capability_id: {type: string}
        pipeline: {type: string}
        enabled: {type: boolean}
        verification_status: {type: string, enum: [verified, pending]}
        settings: {type: object}
        source: {type: string, enum: [endpoint_override, publisher_default, unset]}
    WatcherSummary:
      type: object
      additionalProperties: false
      required: [watcher_id, display_name, current_revision, updated_at]
      properties:
        watcher_id:
          type: string
        display_name:
          type: string
        current_revision:
          type: [integer, 'null']
        updated_at:
          type: string
          format: date-time
    ConfigWrite:
      type: object
      additionalProperties: false
      required: [config_version, config]
      properties:
        config_version:
          type: integer
          minimum: 1
        config:
          type: object
    ConfigSnapshot:
      type: object
      additionalProperties: false
      required: [api_version, watcher_id, revision, config_version, config, config_sha256, updated_at]
      properties:
        api_version:
          type: integer
          const: 1
        watcher_id:
          type: string
        revision:
          type: integer
          minimum: 1
        config_version:
          type: integer
          minimum: 1
        config:
          type: object
        config_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        updated_at:
          type: string
          format: date-time
    AvatarWrite:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [auto, manual]
        url:
          type: [string, 'null']
          maxLength: 2048
          format: uri
          description: Required for manual mode and omitted for automatic mode.
    ProfileAvatar:
      type: object
      additionalProperties: false
      required: [watcher_id, profile_id, handle, display_name, profile_url, enabled, avatar]
      properties:
        watcher_id:
          type: string
        profile_id:
          type: string
        handle:
          type: string
        display_name:
          type: string
        profile_url:
          type: string
          format: uri
        enabled:
          type: boolean
        avatar:
          type: object
          additionalProperties: false
          required: [mode, url, source, fetched_at, last_success_at, last_error, updated_at]
          properties:
            mode:
              type: string
              enum: [auto, manual]
            url:
              type: [string, 'null']
              format: uri
            source:
              type: [string, 'null']
            fetched_at:
              type: [string, 'null']
              format: date-time
            last_success_at:
              type: [string, 'null']
              format: date-time
            last_error:
              type: [string, 'null']
              maxLength: 500
            updated_at:
              type: string
              format: date-time
    ScheduleWrite:
      type: object
      additionalProperties: false
      required: [enabled, interval_seconds, timezone]
      properties:
        enabled:
          type: boolean
        interval_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          multipleOf: 60
        timezone:
          type: string
          const: Asia/Jakarta
          description: Bursawatch Hermes host timezone. It is fixed for interval jobs.
    ScheduleSnapshot:
      type: object
      additionalProperties: false
      required: [api_version, job_id, revision, enabled, interval_seconds, timezone, schedule_sha256, updated_at]
      properties:
        api_version:
          type: integer
          const: 1
        job_id:
          type: string
        revision:
          type: integer
          minimum: 1
        enabled:
          type: boolean
        interval_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          multipleOf: 60
        timezone:
          type: string
        schedule_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        updated_at:
