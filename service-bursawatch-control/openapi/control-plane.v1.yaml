        api_version:
          type: integer
          const: 1
        watcher_id:
          type: string
        revision:
          type: integer
          minimum: 1
        config_version:
          type: integer
          minimum: 1
        config:
          type: object
        config_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        updated_at:
          type: string
          format: date-time
    AvatarWrite:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [auto, manual]
        url:
          type: [string, 'null']
          maxLength: 2048
          format: uri
          description: Required for manual mode and omitted for automatic mode.
    ProfileAvatar:
      type: object
      additionalProperties: false
      required: [watcher_id, profile_id, handle, display_name, profile_url, enabled, avatar]
      properties:
        watcher_id:
          type: string
        profile_id:
          type: string
        handle:
          type: string
        display_name:
          type: string
        profile_url:
          type: string
          format: uri
        enabled:
          type: boolean
        avatar:
          type: object
          additionalProperties: false
          required: [mode, url, source, fetched_at, last_success_at, last_error, updated_at]
          properties:
            mode:
              type: string
              enum: [auto, manual]
            url:
              type: [string, 'null']
              format: uri
            source:
              type: [string, 'null']
            fetched_at:
              type: [string, 'null']
              format: date-time
            last_success_at:
              type: [string, 'null']
              format: date-time
            last_error:
              type: [string, 'null']
              maxLength: 500
            updated_at:
              type: string
              format: date-time
    ScheduleWrite:
      type: object
      additionalProperties: false
      required: [enabled, interval_seconds, timezone]
