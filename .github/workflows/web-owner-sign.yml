name: Web Owner Sign

on:
  workflow_run:
    workflows: ["Web CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-owner-sign-main
  cancel-in-progress: false

jobs:
  sign:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted main source
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Sign validated web content as project owner
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ABSOLUTEPRAYA_WEB_SIGN_TOKEN }}
          WEB_CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo '::error::Daffa must configure ABSOLUTEPRAYA_WEB_SIGN_TOKEN in repository Actions secrets.'
            exit 1
          fi

          owner_login="$(gh api user --jq .login)"
          if [[ "$owner_login" != 'absolutepraya' ]]; then
            echo '::error::The web sign token must belong to the absolutepraya GitHub account.'
            exit 1
          fi
          owner_id="$(gh api user --jq .id)"
          git config user.name "$owner_login"
          git config user.email "${owner_id}+${owner_login}@users.noreply.github.com"
          gh auth setup-git

          python3 scripts/web_owner_sign.py --validated-sha "$WEB_CI_SHA"
