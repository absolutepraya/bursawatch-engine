name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bursawatch
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bursawatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install PDF test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check tracked-file policy
        run: python scripts/repository_policy.py

      - name: Check shell syntax
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh' '*/bin/*' 'scripts/*' | while IFS= read -r script_path; do
            if head -n 1 "$script_path" | grep -Eq '^#!.*(ba|z)?sh'; then
              printf '%s\n' "$script_path"
            fi
          done)

      - name: Validate migrations on ephemeral PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bursawatch
        run: |
          python service-bursawatch-control/bin/migrate.py
          python service-bursawatch-control/bin/seed_baseline_configs.py
          python service-bursawatch-control/bin/migrate.py

      - name: Verify API connection reuse on ephemeral PostgreSQL
        env:
          BURSAWATCH_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/bursawatch
        run: python -m pytest -q service-bursawatch-control/tests/test_postgres_pool_integration.py

  tests:
    name: Deterministic package suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            cron-tg-phintraco-swing/requirements.txt

      - name: Install PDF test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt -r cron-tg-phintraco-swing/requirements.txt

      - name: Run remaining deterministic suites
        env:
          PYTHON: python
          SKIP_WHATSAPP_CHANNEL_WATCH: "1"
        run: bash scripts/test-all

  whatsapp-channel-watch:
    name: WhatsApp Channel Watch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python watcher suite
        run: python -m pytest -q cron-wa-channel-watch/tests

      - name: Run JavaScript channel sink suite
        run: node --test cron-wa-channel-watch/tests/channel_sink.test.mjs

      - name: Summarize WhatsApp coverage
        if: always()
        run: |
          {
            echo "### WhatsApp Channel Watch"
            echo "- Python suite: \`cron-wa-channel-watch/tests\`"
            echo "- JavaScript sink suite: \`cron-wa-channel-watch/tests/channel_sink.test.mjs\`"
          } >> "$GITHUB_STEP_SUMMARY"
