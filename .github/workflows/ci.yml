name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bursawatch
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bursawatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install PDF test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check tracked-file policy
        run: python scripts/repository_policy.py

      - name: Check shell syntax
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh' '*/bin/*' 'scripts/*' | while IFS= read -r script_path; do
            if head -n 1 "$script_path" | grep -Eq '^#!.*(ba|z)?sh'; then
              printf '%s\n' "$script_path"
            fi
          done)

      - name: Validate migrations on ephemeral PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bursawatch
        run: |
          python service-bursawatch-control/bin/migrate.py
          python service-bursawatch-control/bin/seed_baseline_configs.py
          python service-bursawatch-control/bin/migrate.py

      - name: Run deterministic focused suites
        env:
          PYTHON: python
        run: bash scripts/test-all
