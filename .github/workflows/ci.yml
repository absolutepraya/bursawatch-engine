name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install PDF test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check tracked-file policy
        run: python scripts/repository_policy.py

      - name: Check shell syntax
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh' '*/bin/*' 'scripts/*' | while IFS= read -r script_path; do
            if head -n 1 "$script_path" | grep -Eq '^#!.*(ba|z)?sh'; then
              printf '%s\n' "$script_path"
            fi
          done)

      - name: Run deterministic focused suites
        env:
          PYTHON: python
          SCELE_TEST_PROFILE: ${{ github.workspace }}/scele-digest/tests/fixtures/course-profile.json
        run: bash scripts/test-all
