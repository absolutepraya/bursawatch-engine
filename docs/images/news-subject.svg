<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc">
<title id="title">News subject and optional company identity lookup</title>
<desc id="desc">Complete source evidence is classified by central subject. Company goes to Stock News, industry to Industry News, macro to Macro News. A separate optional Yahoo identity lookup enables company price trackers; unresolved identity keeps the company name without a tracker.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a9b0a9"/></marker></defs>
<rect width="1000" height="290" rx="12" fill="#141615"/>
<g fill="#1c1f1d" stroke="#dea777" stroke-width="1.5"><rect x="25" y="96" width="190" height="76" rx="8"/><rect x="260" y="96" width="205" height="76" rx="8"/><rect x="535" y="20" width="165" height="60" rx="8"/><rect x="535" y="104" width="165" height="60" rx="8"/><rect x="535" y="188" width="165" height="60" rx="8"/><rect x="760" y="20" width="215" height="228" rx="8"/></g>
<g stroke="#a9b0a9" fill="none" marker-end="url(#arrow)"><path d="M215 134H255"/><path d="M465 134H500V50H530"/><path d="M465 134H530"/><path d="M500 134V218H530"/><path d="M700 50H755"/></g>
<g font-family="sans-serif" fill="#edf0eb" font-size="16" text-anchor="middle"><text x="120" y="127">Complete source</text><text x="120" y="150">evidence</text><text x="362" y="127">Classify central subject</text><text x="362" y="150" fill="#a9b0a9" font-size="13">Validate source quote + route</text><text x="618" y="45">Company</text><text x="618" y="65" fill="#a9b0a9" font-size="13">Stock News</text><text x="618" y="130">Industry</text><text x="618" y="150" fill="#a9b0a9" font-size="13">Industry News</text><text x="618" y="214">Macro</text><text x="618" y="234" fill="#a9b0a9" font-size="13">Macro News</text><text x="867" y="53">Optional Yahoo lookup</text><text x="867" y="87" fill="#a9b0a9" font-size="13">Unique company + exchange</text><text x="867" y="121">Verified ticker</text><text x="867" y="143" fill="#a9b0a9" font-size="13">Price tracker</text><text x="867" y="185">Unresolved identity</text><text x="867" y="207" fill="#a9b0a9" font-size="13">Company name, no tracker</text><text x="867" y="230" fill="#a9b0a9" font-size="13">Remains Stock News</text></g></svg>