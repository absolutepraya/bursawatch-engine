      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const D = 8.73;
          const BEAT0 = 2.73; // pain beats start on the music grid (0.5s beats)
          const PAIN = 1.5;

          // camera: slow continuous push so holds never freeze
          tl.fromTo("#s1-cam", { scale: 1 }, { scale: 1.035, duration: D, ease: "none" }, 0);
          tl.fromTo("#s1-glow", { opacity: 0.55, scale: 0.92 }, { opacity: 1, scale: 1.06, duration: 2.6, ease: "sine.inOut" }, 0);

          // hook: ref 1 word-by-word mask rise, speech cadence
          const hookTimes = [0.3, 0.42, 0.56, 0.72, 0.86, 1.06, 1.2, 1.64, 1.76, 1.92];
          const hookWords = gsap.utils.toArray("#s1-hook .wi");
          hookWords.forEach((w, i) => {
            tl.fromTo(w, { yPercent: 105 }, { yPercent: 0, duration: 0.16, ease: "expo.out" }, hookTimes[i]);
          });
          // hook lifts away into the kicker
          tl.to("#s1-hook", { y: -330, scale: 0.42, opacity: 0, duration: 0.3, ease: "power3.in" }, 2.43);
          tl.fromTo("#s1-kicker", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 2.63);
          tl.fromTo("#s1-count", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 2.73);

          const counts = ["01 / 04", "02 / 04", "03 / 04", "04 / 04"];
          for (let i = 0; i < 4; i++) {
            const t0 = BEAT0 + i * PAIN;
            const card = "#s1-c" + i;
            const pane = "#s1-p" + i;
            const blurNode = document.getElementById("s1-b" + i);
            const proxy = { v: 22 };
            const write = () => blurNode.setAttribute("stdDeviation", proxy.v + " 0");
            write();
            // card arrives from the left: 12 frames, fast start, soft land, blur rides the same ease
            tl.fromTo(card, { x: -340, opacity: 0 }, { x: 0, opacity: 1, duration: 0.22, ease: "expo.out" }, t0);
            tl.fromTo(proxy, { v: 22 }, { v: 0, duration: 0.22, ease: "expo.out", onUpdate: write }, t0);
            // older cards get pushed back
            for (let k = 0; k < i; k++) {
              const depth = i - k;
              tl.to("#s1-c" + k, { x: -70 * depth, scale: 1 - 0.07 * depth, opacity: depth === 1 ? 0.32 : 0.12, duration: 0.3, ease: "expo.out" }, t0);
            }
            // question words rise, answer slams on the next beat
            gsap.utils.toArray(pane + " .q .wi").forEach((w, j) => {
              tl.fromTo(w, { yPercent: 105 }, { yPercent: 0, duration: 0.16, ease: "expo.out" }, t0 + 0.12 + j * 0.07);
            });
            tl.fromTo(pane + " .a", { opacity: 0, scale: 1.22, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out" }, t0 + 0.5);
            // previous pane leaves as the new card lands
            if (i > 0) tl.to("#s1-p" + (i - 1), { opacity: 0, y: -24, duration: 0.14, ease: "power2.in" }, t0);
            tl.set("#s1-count", { textContent: counts[i] }, t0);
            tl.set(pane, { opacity: 1 }, t0);
          }
          // initial pane visibility
          [0, 1, 2, 3].forEach((i) => tl.set("#s1-p" + i, { opacity: 0 }, 0));

          // X: chart flips red right as Rungkad lands
          tl.to("#s1-down", { strokeDashoffset: 0, duration: 0.28, ease: "power2.in" }, BEAT0 + 3 * PAIN + 0.3);
          tl.to("#s1-up", { stroke: "#F23F43", duration: 0.1 }, BEAT0 + 3 * PAIN + 0.5);

          // exit: everything sweeps left to hand off to the wall (cards keep travelling)
          tl.to("#s1-stage", { x: -520, opacity: 0, duration: 0.26, ease: "power3.in" }, D - 0.3);
          tl.to("#s1-p3, #s1-kicker, #s1-count", { opacity: 0, duration: 0.2, ease: "power2.in" }, D - 0.26);

          window.__timelines["s1-pains"] = tl;
        })();
